[project]
name = "splitter"
version = "0.1.0"
description = "Payment splitter service in USDC on Monad"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Contracts
    "vyper>=0.4.0",
    # Crypto / chain
    "eth-utils>=4.0",
    "eth-abi>=5.0",
    "eth-account>=0.11",
    "web3>=6.0",
    # Web
    "python-fasthtml>=0.6",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    # Docs
    "mkdocs-material>=9.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["shared/tests"]
pythonpath = ["."]
